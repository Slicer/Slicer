# Set update schedules for GitHub Actions, Python and npm dependencies

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      # Prefix all commit messages with "COMP: "
      prefix: "COMP"

  - package-ecosystem: "pip"
    directories:
      - "/SuperBuild/Python"
      - "/" # requirements-docs.txt
    schedule:
      interval: "monthly"
    # Disable routine version-update PRs, not security-update PRs.
    # Enable security updates in repository settings after verifying alerts.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "COMP"

  - package-ecosystem: "npm"
    directory: "/Modules/Scripted/WebServer/Resources/docroot"
    schedule:
      interval: "monthly"
    # Disable routine version-update PRs, not security-update PRs.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "COMP"
